name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview:test -- --run
      - run: npm run preview:build
      - run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            release/*setup*.exe
            release/*portable*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview:test -- --run
      - run: npm run preview:build
      - run: npx electron-builder --mac dmg zip --arm64 --publish never
      - run: node apps/desktop/create-mac-update-manifest.cjs arm64
      - run: find release -maxdepth 3 -name '*.app' -type d -exec codesign --verify --deep --strict {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac-arm64.json
          if-no-files-found: error
          retention-days: 14

  macos-x64:
    name: macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview:test -- --run
      - run: npm run preview:build
      - run: npx electron-builder --mac dmg zip --x64 --publish never
      - run: node apps/desktop/create-mac-update-manifest.cjs x64
      - run: find release -maxdepth 3 -name '*.app' -type d -exec codesign --verify --deep --strict {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-x64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac-x64.json
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
